[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-chess"
version = "0.1.0"
description = "Chess vision (localization + CV model) from Sensing"
requires-python = ">=3.8"
dependencies = [
    "depthai",
    "opencv-python",
    "depthai-nodes",
]

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-dir]
"sensing_chess" = "src"
